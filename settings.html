<div id="aero_mobile_ui_settings" class="extension_container">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>Aero Mobile UI</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <div class="aero-setting-row">
        <label for="aero_theme_mode">界面气候主题（防误触内置切换）</label>
        <select id="aero_theme_mode" class="text_pole">
          <option value="day">日间主方案（Neo Frutiger · 浅色糖果生态）</option>
          <option value="night">夜间备选方案（深海荧光珊瑚礁）</option>
        </select>
      </div>

      <div class="aero-setting-row" style="margin-top: 8px;">
        <label for="aero_prose_glass">正文背景通透度（呼吸感调节）</label>
        <select id="aero_prose_glass" class="text_pole">
          <option value="airy">轻盈呼吸（62% 玻璃 · 更透出壁纸光感）</option>
          <option value="balanced">均衡琉璃（72% 玻璃 · 推荐）</option>
          <option value="solid">稳重磨砂（88% · 适合复杂高对比壁纸）</option>
        </select>
      </div>

      <div class="aero-setting-row" style="margin-top: 8px;">
        <label for="aero_font_style">字体风格</label>
        <select id="aero_font_style" class="text_pole">
          <option value="sans">系统默认字体（推荐 · 清爽原生）</option>
          <option value="serif">人文衬线字体（仅AI叙事与角色名）</option>
        </select>
      </div>

      <hr class="sysHR" style="margin: 10px 0;" />

      <div class="aero-setting-row checkbox_label">
        <input id="aero_hide_wand" type="checkbox" />
        <label for="aero_hide_wand">隐藏输入栏魔法棒按钮（保留横菜单）</label>
      </div>

      <div class="aero-setting-row checkbox_label" style="margin-top: 6px;">
        <input id="aero_compact_meta" type="checkbox" />
        <label for="aero_compact_meta">铭牌紧凑模式（略微压缩上下边距）</label>
      </div>

      <hr class="sysHR" style="margin: 10px 0;" />

      <div class="aero-setting-row" style="gap: 8px;">
        <div style="display: flex; gap: 8px; align-items: center;">
          <button id="aero_check_update_btn" type="button" class="menu_button" style="flex: 1; padding: 7px 10px;">
            <i class="fa-solid fa-rotate"></i> 检查并更新扩展
          </button>
          <button id="aero_open_mgr_btn" type="button" class="menu_button" style="display: none; padding: 7px 10px;">
            <i class="fa-solid fa-cubes"></i> 管理扩展
          </button>
          <button id="aero_reload_btn" type="button" class="menu_button active" style="display: none; padding: 7px 12px;">
            <i class="fa-solid fa-arrows-rotate"></i> 刷新生效
          </button>
        </div>
        <small id="aero_update_status">当前版本：v9.0 Clean Neo Frutiger</small>
      </div>
    </div>
  </div>
</div>
