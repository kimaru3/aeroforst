<div id="aero_mobile_ui_settings" class="extension_container">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>Aero Mobile UI</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <div class="aero-setting-row">
        <label for="aero_theme_mode">界面气候主题（防误触内置切换）</label>
        <select id="aero_theme_mode" class="text_pole">
          <option value="day">日间主方案（浅/中明度 · 暖顶冷底）</option>
          <option value="night">夜间备选方案（深色低疲劳）</option>
        </select>
      </div>

      <div class="aero-setting-row checkbox_label" style="margin-top: 8px;">
        <input id="aero_hide_wand" type="checkbox" />
        <label for="aero_hide_wand">隐藏输入栏魔法棒按钮（保留横菜单）</label>
      </div>

      <div class="aero-setting-row checkbox_label" style="margin-top: 6px;">
        <input id="aero_compact_meta" type="checkbox" />
        <label for="aero_compact_meta">元数据极简模式（压缩上下边距）</label>
      </div>
    </div>
  </div>
</div>
